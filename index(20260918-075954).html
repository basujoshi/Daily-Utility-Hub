<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Daily Utility Hub</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f7fb;color:#172033}.wrap{max-width:1120px;margin:auto;padding:18px}.hero{padding:26px;border-radius:23px;background:linear-gradient(135deg,#102d48,#137a91);color:#fff}.hero h1{margin:0}.hero p{color:#d9f1f7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #dce5ee;border-radius:18px;padding:18px;box-shadow:0 8px 25px #1720330d}.muted{color:#68788b;font-size:13px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #c8d5e1;border-radius:10px;background:#fff;color:#172033}textarea{min-height:120px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border:0;border-radius:10px;background:#137a91;color:#fff;font-weight:800}.btn.alt{background:#e7f1f5;color:#17485a}.out{margin-top:11px;padding:12px;border-radius:11px;background:#f1f6f9;min-height:42px;font-weight:700}.footer{text-align:center;color:#738297;padding:24px;font-size:12px}</style></head>
<body><div class="wrap"><div class="hero"><h1>🧮 BD Daily Utility Hub</h1><p>Fast everyday calculators and converters. No login required.</p></div><div class="grid">
<section class="card"><h2>Percentage & Discount</h2><div class="field"><label>Amount</label><input id="price" type="number" value="1000"></div><div class="field"><label>Percent %</label><input id="pct" type="number" value="10"></div><div class="row"><button class="btn" onclick="pct()">Percentage</button><button class="btn alt" onclick="discount()">Discount</button><button class="btn alt" onclick="markup()">Add %</button></div><div id="pctOut" class="out"></div></section>
<section class="card"><h2>🏦 EMI Calculator</h2><div class="field"><label>Principal</label><input id="loan" type="number" value="500000"></div><div class="field"><label>Annual interest %</label><input id="rate" type="number" step=".01" value="10"></div><div class="field"><label>Tenure in months</label><input id="months" type="number" value="60"></div><button class="btn" onclick="emi()">Calculate EMI</button><div id="emiOut" class="out"></div></section>
<section class="card"><h2>🎂 Age Calculator</h2><div class="field"><label>Date of birth</label><input id="dob" type="date"></div><button class="btn" onclick="age()">Calculate Age</button><div id="ageOut" class="out"></div></section>
<section class="card"><h2>📅 Date Difference</h2><div class="field"><label>Start date</label><input id="d1" type="date"></div><div class="field"><label>End date</label><input id="d2" type="date"></div><button class="btn" onclick="dateDiff()">Calculate</button><div id="dateOut" class="out"></div></section>
<section class="card"><h2>📏 Unit Converter</h2><select id="unit"><option value="kmmi">Kilometre → Mile</option><option value="mft">Metre → Feet</option><option value="kg">Kilogram → Pound</option><option value="lbkg">Pound → Kilogram</option><option value="cf">Celsius → Fahrenheit</option><option value="fc">Fahrenheit → Celsius</option></select><div class="field"><input id="val" type="number" placeholder="Value"></div><button class="btn" onclick="convert()">Convert</button><div id="convOut" class="out"></div></section>
<section class="card"><h2>📝 Word Counter</h2><textarea id="words" oninput="countWords()" placeholder="Type or paste text..."></textarea><div id="wordOut" class="out"></div></section>
</div><div class="footer">BD Daily Utility Hub • Calculations run in your browser.</div></div>
<script>
const $=id=>document.getElementById(id),num=id=>Number($(id).value);
function pct(){let a=num('price'),p=num('pct');$('pctOut').textContent=Number.isFinite(a)&&Number.isFinite(p)?`${p}% of ${a} = ${(a*p/100).toFixed(2)}`:'Enter valid numbers'}
function discount(){let a=num('price'),p=num('pct'),d=a*p/100;$('pctOut').textContent=`Discount: ${d.toFixed(2)} • Final price: ${(a-d).toFixed(2)}`}
function markup(){let a=num('price'),p=num('pct');$('pctOut').textContent=`Added: ${(a*p/100).toFixed(2)} • Final: ${(a+a*p/100).toFixed(2)}`}
function emi(){let P=num('loan'),r=num('rate')/1200,n=num('months');if(P<=0||n<=0){$('emiOut').textContent='Enter valid values';return}let e=r?P*r*(1+r)**n/((1+r)**n-1):P/n,total=e*n;$('emiOut').textContent=`Monthly EMI: ${e.toFixed(2)} • Total payment: ${total.toFixed(2)} • Interest: ${(total-P).toFixed(2)}`}
function age(){let s=$('dob').value;if(!s)return $('ageOut').textContent='Select date of birth';let b=new Date(s+'T00:00:00'),t=new Date(),y=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth(),d=t.getDate()-b.getDate();if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate()}if(m<0){y--;m+=12}$('ageOut').textContent=`Age: ${y} years, ${m} months, ${d} days`}
function dateDiff(){if(!$('d1').value||!$('d2').value)return $('dateOut').textContent='Select both dates';let a=new Date($('d1').value+'T00:00:00'),b=new Date($('d2').value+'T00:00:00'),days=Math.round(Math.abs(b-a)/86400000);$('dateOut').textContent=`Difference: ${days.toLocaleString()} day${days===1?'':'s'}`}
function convert(){let v=num('val'),u=$('unit').value;if(!Number.isFinite(v))return $('convOut').textContent='Enter a value';let a=u==='kmmi'?v*.621371:u==='mft'?v*3.28084:u==='kg'?v*2.2046226218:u==='lbkg'?v*.45359237:u==='cf'?v*9/5+32:(v-32)*5/9;$('convOut').textContent=`Result: ${a.toFixed(6).replace(/\.?0+$/,'')}`}
function countWords(){let t=$('words').value.trim(),w=t?t.split(/\s+/).length:0;$('wordOut').textContent=`Words: ${w.toLocaleString()} • Characters: ${$('words').value.length.toLocaleString()} • Lines: ${t?t.split(/\n/).length:0}`}
</script></body></html>
